<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Office Door Sign Controls</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin">
  <main>
    <div class="admin-header">
      <div class="admin-heading">
        <h1>Office Door Sign</h1>
        <p class="hint">Choose a status, optionally add a message or return time.</p>
      </div>
      <div class="admin-actions">
        <button class="icon-button update" type="button" id="updateButton" aria-label="Update" title="Update software">
          <span class="action-icon" aria-hidden="true">↻</span>
          <span class="button-label">Update</span>
        </button>
        <a class="icon-button cancel" href="/" aria-label="Cancel" title="Cancel">
          <span class="action-icon" aria-hidden="true">✕</span>
          <span class="button-label">Cancel</span>
        </a>
        <button class="icon-button save" type="submit" form="statusForm" aria-label="Save" title="Save">
          <span class="action-icon" aria-hidden="true">✓</span>
          <span class="button-label">Save</span>
        </button>
      </div>
    </div>
    <div class="device-info">
      <div>
        <span>Device IP</span>
        <strong>{{ local_ip }}</strong>
      </div>
      <div>
        <span>Remote Admin</span>
        <strong>{% if local_ip != 'Unavailable' %}http://{{ local_ip }}:{{ port }}/admin{% else %}Unavailable{% endif %}</strong>
      </div>
    </div>
    <form id="statusForm">
      <div class="status-grid">
        {% for key, val in statuses.items() %}
        <button type="button" class="status-choice" data-status="{{key}}">{{val[0]}}</button>
        {% endfor %}
      </div>
      <input type="hidden" name="status" id="status" value="in">
      <label>Message<input name="message" id="messageInput" maxlength="160" placeholder="Optional message"></label>
      <label>Return time<input name="return_time" id="returnInput" maxlength="80" placeholder="e.g. Back at 2:30 PM"></label>
    </form>
  </main>
  <div class="onscreen-keyboard" id="onscreenKeyboard" aria-hidden="true">
    <div class="keyboard-toolbar">
      <strong id="keyboardFieldLabel">Keyboard</strong>
      <button type="button" class="keyboard-done" data-key="done">Done</button>
    </div>
    <div class="keyboard-keys" id="keyboardKeys"></div>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
